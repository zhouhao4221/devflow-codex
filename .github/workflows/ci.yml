name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: ./scripts/validate-skills.sh --ci
      - run: python3 scripts/test-command-models.py
      - run: python3 scripts/test-export-skills.py
      - name: Verify generated marketplace artifacts
        run: |
          python3 scripts/generate-codex-marketplace.py
          git diff --exit-code -- .agents/plugins plugins
